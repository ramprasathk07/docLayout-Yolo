[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indicdlp-doclayout"
version = "0.2.0"
description = "Bounded IndicDLP streaming, grouped cross-validation, and tracked DocLayout-YOLO training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3", "huggingface-hub>=0.27,<2", "pyarrow>=18,<25",
  "Pillow>=10.4,<13", "PyYAML>=6,<7", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
train = [
  "doclayout-yolo==0.0.4", "albumentations>=1.4.11,<2", "numpy>=1.26,<2",
  "torch>=2.2,<2.6", "torchvision>=0.17,<0.21", "scikit-learn>=1.4,<1.7",
  "wandb>=0.31,<0.32",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "scikit-learn>=1.4,<1.7"]

[project.scripts]
indicdlp = "indicdlp.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indicdlp = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
